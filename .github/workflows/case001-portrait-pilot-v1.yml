name: Case001 portrait pilot (art only)
on:
  push:
    branches: [review/case001-portrait-pilot-v1]
    paths:
      - "scripts/case001-portrait-pilot-v1.py"
      - ".github/workflows/case001-portrait-pilot-v1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crop-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/case001-portrait-pilot-v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: case001-portrait-pilot-v1
          path: work/case001-portrait-pilot/
          retention-days: 14
