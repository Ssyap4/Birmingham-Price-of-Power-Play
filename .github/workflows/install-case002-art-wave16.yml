name: Install Case 002 wave 16 (five checksum-locked mobile WebPs)
on:
  push:
    branches: [feat/case002-story-bible-v1]
    paths:
      - 'tools/case002/wave-16-upload-url.txt'
permissions:
  contents: write
concurrency:
  group: case002-wave16-install
  cancel-in-progress: false
jobs:
  install:
    if: github.ref_name == 'feat/case002-story-bible-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/case002-story-bible-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Validate public GitHub attachment URL
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          file=Path('tools/case002/wave-16-upload-url.txt')
          url=file.read_text().strip()
          if not re.fullmatch(r'https://github\.com/user-attachments/files/[0-9]+/[A-Za-z0-9._-]+\.zip(?:\?[^\s]*)?',url):
              raise SystemExit('Refusing non-GitHub ZIP attachment URL')
          Path('/tmp/case002-wave16-url').write_text(url)
          PY
      - name: Fetch single art archive (public GitHub only)
        run: |
          curl --fail --location --retry 3 --max-time 120 \
            --output /tmp/case002-wave16.zip "$(cat /tmp/case002-wave16-url)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator dependencies
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Validate exact five WebPs and update manifest
        run: python tools/case002/install-art-wave-16.py /tmp/case002-wave16.zip
      - name: Run targeted art gate (no 400 seeded routes)
        run: |
          node tests/case002/validate-storyboard-v1.js
          node tests/case002/cast-registry-v1.test.js
          node tests/case002/scene-cast-v1.test.js
          node tests/case002/approved-art-v1.test.js
          node tools/case002/art-audit-v1.js
          node tests/case002/art-audit-v1.test.js
          node tests/case002/scene-art-v1.test.js
      - name: Quick mobile Chromium (360, 390, 430px)
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.62.0'
          python -m playwright install --with-deps chromium
          python tests/case002/mobile_browser_smoke.py --quick
      - name: Commit five files plus manifest into existing feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/case002/approved-art-v1.js
          for sid in c01 c02 c03 c04 c05; do
            git add -- "assets/case002/scenes/case002-${sid}-scene--mobile.webp"
          done
          git diff --cached --quiet && { echo "No art changes"; exit 1; }
          git commit -m "art(case002): install reviewed chapter III wave C01-C05"
          git push origin HEAD:feat/case002-story-bible-v1
