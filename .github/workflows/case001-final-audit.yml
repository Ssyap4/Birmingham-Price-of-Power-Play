name: Case 001 final full narrative audit
on:
  workflow_dispatch:
  push:
    branches: [feat/case001-district-briefing-phone]
    paths:
      - '.github/workflows/case001-final-audit.yml'
      - 'case-v14.js'
      - 'tests/case001/run_tests.py'
permissions:
  contents: write
concurrency:
  group: case001-final-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  narrative-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Playwright Chromium
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.62.0'
          python -m playwright install --with-deps chromium
      - name: Full browser narrative and save regression
        id: audit
        run: |
          set +e
          CASE001_QA_ARTIFACTS=/tmp/case001-qa python tests/case001/run_tests.py > /tmp/case001-final.log 2>&1
          code=$?
          grep -E 'PASS|FAIL|passed|failed|Traceback|AssertionError|TimeoutError' /tmp/case001-final.log | tail -n 240
          echo "result=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Save compact final report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "tested_commit=${GITHUB_SHA}"
            echo "result=${{ steps.audit.outputs.result || 'not_run' }}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            tail -n 220 /tmp/case001-final.log 2>/dev/null || true
          } > tests/case001/final-audit-status.txt
          git add tests/case001/final-audit-status.txt
          git commit -m "ci: final Case 001 narrative report [skip ci]" || exit 0
          git push origin HEAD:feat/case001-district-briefing-phone
