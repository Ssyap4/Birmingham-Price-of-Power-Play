name: Case 001 phone district and briefing QA
on:
  push:
    branches: [feat/case001-district-briefing-phone]
    paths:
      - 'districts-v13.js'
      - 'case001-briefing-v1.js'
      - 'case001-briefing-v1.css'
      - 'tests/case001/district_briefing_smoke.py'
      - 'tests/case001/briefing_achievements_tests.py'
      - 'tests/case001/mobile_feedback_smoke.py'
      - '.github/workflows/case001-district-briefing.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  focused-phone:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser engines
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.62.0'
          python -m playwright install --with-deps chromium webkit
      - name: Check JavaScript syntax
        run: |
          node --check districts-v13.js
          node --check case001-briefing-v1.js
          node --check case-v14.js
      - name: Run district and briefing mobile smoke
        id: test
        run: |
          set +e
          { python tests/case001/district_briefing_smoke.py && python tests/case001/briefing_achievements_tests.py && python tests/case001/mobile_feedback_smoke.py; } > /tmp/district-briefing.log 2>&1
          code=$?
          cat /tmp/district-briefing.log
          echo "result=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Write verifiable QA report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "tested_commit=${GITHUB_SHA}"
            echo "result=${{ steps.test.outputs.result || 'not_run' }}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            cat /tmp/district-briefing.log 2>/dev/null || true
          } > tests/case001/district-briefing-status.txt
          git add tests/case001/district-briefing-status.txt
          git commit -m "ci: district briefing QA report [skip ci]" || exit 0
          git push origin HEAD:feat/case001-district-briefing-phone
