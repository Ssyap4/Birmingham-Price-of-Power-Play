name: Unified Birmingham campaign Safari beta (branch only)
# Case 001 and Case 002 share one origin in this staged package.
# This workflow never deploys, merges or touches stable main.
on:
  push:
    branches: [feat/case002-story-bible-v1]
    paths:
      - 'deployment/campaign-unified-release.js'
      - 'tests/case002/unified-package-integrity.test.js'
      - 'tests/case002/unified_campaign_browser_smoke.py'
      - '.github/workflows/campaign-unified-safari.yml'
      - 'case002-map-entry-v1.js'
      - 'campaign-hub-v1.js'
      - 'campaign-case002-archive-v1.js'
      - 'campaign-case002-archive-v1.css'
      - 'index.html'
      - 'tests/case002/unified-archive-v1.test.js'
      - 'case002-map-entry-v1.css'
      - 'preview/case002-prototype/index.html'
      - 'preview/case002-prototype/app.js'
      - 'preview/case002-prototype/style.css'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: birmingham-unified-safari-beta
  cancel-in-progress: true
jobs:
  unified-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build one same-origin campaign directory
        run: node deployment/campaign-unified-release.js
      - name: Audit both cases, all referenced resources and approved artwork
        run: node tests/case002/unified-package-integrity.test.js
      - name: Audit read-only shared archive with all 35 endings and corrupt data
        run: node tests/case002/unified-archive-v1.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the two iPhone browser engines
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.62.0'
          python -m playwright install --with-deps chromium webkit
      - name: Exercise actual packaged map and both cases on mobile Chromium and WebKit
        run: python tests/case002/unified_campaign_browser_smoke.py
      - name: Upload the exact combined standalone website
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: birmingham-unified-campaign-safari-beta
          path: campaign-unified-dist/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve mobile visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birmingham-unified-iphone-qa-screens
          path: campaign-unified-qa-screens/
          if-no-files-found: ignore
          retention-days: 7
