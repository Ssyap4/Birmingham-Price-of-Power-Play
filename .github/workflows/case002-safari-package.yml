name: Case 002 isolated Safari beta package
on:
  push:
    branches: [feat/case002-story-bible-v1]
    paths:
      - 'deployment/case002-safari-preview.js'
      - 'vercel.json'
      - 'preview/case002-prototype/**'
      - 'src/case002/**'
      - 'assets/case002/scenes/**'
      - 'assets/case002/portraits/**'
      - 'assets/case-scenes/hero*.webp'
      - '.github/workflows/case002-safari-package.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: case002-safari-package
  cancel-in-progress: true
jobs:
  static-package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build exact portrait-only preview
        run: node deployment/case002-safari-preview.js
      - name: Inspect isolated files (no legacy case)
        run: |
          test -s case002-preview-dist/index.html
          test -s case002-preview-dist/preview/case002-prototype/index.html
          test -s case002-preview-dist/assets/case002/scenes/case002-p01-scene--mobile.webp
          test ! -e case002-preview-dist/001.html
          test ! -e case002-preview-dist/assets/case002/scenes/case002-p01-scene.webp
      - uses: actions/upload-artifact@v4
        with:
          name: case002-safari-beta
          path: case002-preview-dist/
          if-no-files-found: error
          retention-days: 14
