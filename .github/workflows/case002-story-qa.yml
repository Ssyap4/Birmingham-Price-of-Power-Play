name: Case 002 story logic (draft only)
on:
  push:
    branches: [feat/case002-story-bible-v1]
    paths:
      - 'docs/case002/**'
      - 'tests/case002/**'
      - 'src/case002/**'
      - 'tools/case002/**'
      - 'preview/case002-prototype/**'
      - '.github/workflows/case002-story-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  story-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate Case 002 evidence and ending predicates
        run: node tests/case002/validate-contract.js
      - name: Validate chapter graph and hero routes
        run: node tests/case002/validate-beat-graph.js
      - name: Simulate 35 nontrivial ending paths through draft graph
        run: node tests/case002/simulate-story-model-v2.js
      - name: Check Case 001 → 002 canon and reward compatibility
        run: node tests/case002/validate-canon-v2.js
      - name: Exercise implemented Case 002 draft engine and persistence
        run: node tests/case002/engine-v3.test.js
      - name: Verify all 15 specialist story detours
        run: node tests/case002/hero-v3.test.js
      - name: Explore 400 seeded playthroughs, locked branches and saved-state reloads
        run: node tests/case002/explore-v3.test.js
      - name: Verify evidence source/custody, irreversible transfer and legacy saves
        run: node tests/case002/evidence-custody-v3.test.js
      - name: Validate dynamic narrative and 35 state-sensitive epilogues
        run: node tests/case002/story-variants-v4.test.js
      - name: Validate 89 future visual briefs against canonical scenes and story flags
        run: node tests/case002/validate-storyboard-v1.js
      - name: Verify reused approved hero portraits are real existing WebP files
        run: node tests/case002/approved-hero-portraits.test.js
      - name: Prevent pre-introduction character spoilers and future phantom portraits
        run: node tests/case002/cast-registry-v1.test.js
      - name: Guard correct Cross surname and visually distinct Mabel/Ada identity briefs
        run: node tests/case002/identity-and-portrait-brief-v1.test.js
      - name: Verify state-dependent illustration selection
        run: node tests/case002/scene-art-v1.test.js
      - name: Verify honest notifications for decisions and consequences
        run: node tests/case002/consequences-v1.test.js
      - name: Verify persistent decision journal and legacy save compatibility
        run: node tests/case002/journal-v1.test.js
      - name: Check offline scene bundle and mobile-preview JavaScript syntax
        run: |
          node tools/case002/build-browser-data.js --check
          node --check src/case002/browser-data-v3.js
          node --check src/case002/engine-v3.js
          node --check src/case002/story-variants-v4.js
          node --check src/case002/scene-art-v1.js
          node --check src/case002/cast-registry-v1.js
          node --check src/case002/consequences-v1.js
          node --check src/case002/journal-v1.js
          node --check preview/case002-prototype/app.js
