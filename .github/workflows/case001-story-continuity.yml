name: Case 001 story continuity and art lock
on:
  push:
    branches: [fix/case001-story-continuity]
    paths:
      - 'case-v14.js'
      - 'tests/case001/story_continuity_smoke.py'
      - '.github/workflows/case001-story-continuity.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  focused-story:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install WebKit + Chromium
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.62.0'
          python -m playwright install --with-deps chromium webkit
      - name: Inspect browser script syntax
        run: node --check case-v14.js
      - name: Verify story continuity + approved scene images
        id: focused
        run: |
          set +e
          python tests/case001/story_continuity_smoke.py > /tmp/story-continuity.log 2>&1
          result=$?
          cat /tmp/story-continuity.log
          echo "result=$result" >> "$GITHUB_OUTPUT"
          exit "$result"
      - name: Write verifiable story QA report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "tested_commit=${GITHUB_SHA}"
            echo "result=${{ steps.focused.outputs.result || 'not_run' }}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            cat /tmp/story-continuity.log 2>/dev/null || true
          } > tests/case001/story-continuity-status.txt
          git add tests/case001/story-continuity-status.txt
          git commit -m "ci: case001 story and artwork report [skip ci]" || exit 0
          git push origin HEAD:fix/case001-story-continuity
