name: Criminal operations v2 acceptance
on:
  push:
    branches: [feat/criminal-operations-codex-v2, feat/criminal-operations-polish-v3]
    paths:
      - "src/criminal/**"
      - "assets/criminal/**"
      - "criminal-operations-v2.css"
      - "tests/criminal/**"
      - "index.html"
      - "player-profile-overview-v1.js"
      - "cabinet-profile-v2.css"
      - "audio-v1.js"
      - "case-v33-inventory.js"
      - "case001-unified-evidence-v1.css"
      - "case001-unified-quicknav-v1.js"
      - "case001-unified-quicknav-v1.css"
      - "campaign-visual-language-v1.css"
      - "case001-unified-finale-v1.js"
      - "campaign-map-journey-v1.js"
      - "audio-v1.css"
      - "cinema-home-v1.css"
      - "cinema-home-v1.js"
      - "campaign-bridge-v13.js"
      - "campaign-bridge-v13.css"
      - "campaign-hub-v1.js"
      - "campaign-case002-archive-v1.js"
      - "session-controls-v1.js"
      - "heroes-v1.js"
      - "case-v14.js"
      - "campaign-achievements-rebalance-v1.css"
      - "case001-campaign-cohesion-v1.js"
      - "preview/case002-prototype/app.js"
      - "preview/case002-prototype/style.css"
      - "campaign-hub-v1.css"
      - "player-overview-cinema-v1.css"
      - "cabinet-menu-v1.css"
      - "mobile-approved-menu-v1.css"
      - "assets/cabinet/profile-seal.svg"
      - "home-story-first-v1.js"
      - "home-two-paths-v1.css"
      - "campaign-criminal-archive-v1.js"
      - "campaign-criminal-archive-v1.css"
      - "deployment/campaign-unified-release.js"
      - "deployment/criminal-standalone-preview.js"
      - "preview/criminal/**"
      - ".github/workflows/criminal-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: criminal-v2-acceptance
  cancel-in-progress: true
jobs:
  isolated-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pure engine, persistence, branch and resource proofs
        run: |
          node --test tests/criminal/engine.test.js tests/criminal/epilogues.test.js tests/criminal/equipment-art.test.js tests/criminal/profile-overview.test.js tests/criminal/campaign-archive-bridge.test.js tests/criminal/menu-art.test.js tests/criminal/unified-v13.test.js
          node --test tests/trial-progress-v1.test.js
          node --check game.js
          node --check session-controls-v1.js
          node --check heroes-v1.js
          node --check profile-page.js
          node --check campaign-hub-v1.js
          node --check case001-campaign-cohesion-v1.js
          node --check case001-unified-quicknav-v1.js
          node --check preview/case002-prototype/app.js
          node --test tests/case002/achievements-v1.test.js
          node tests/criminal/playthroughs.js
          python tests/case001/story_first_home_tests.py
      - name: Build the unified offline package and verify unchanged Case002 contract
        run: |
          node deployment/campaign-unified-release.js
          node tests/case002/unified-package-integrity.test.js
          node deployment/criminal-standalone-preview.js
      - name: Install test-only decoders and mobile browser engines
        run: |
          python -m pip install 'playwright==1.62.0' 'Pillow==11.3.0'
          python -m playwright install --with-deps chromium webkit
      - name: Decode every new frame and test real phone touch flows
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python tests/criminal/art_package.py
          python tests/criminal/startup_isolation.py
          python tests/criminal/case001_art_browser.py
          python tests/criminal/legacy_smoke.py
          python tests/criminal/mobile_browser.py
          python tests/criminal/standalone_mobile.py
      - name: Keep route proofs and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criminal-v2-acceptance
          path: work/criminal/
          retention-days: 14
      - name: Keep the reviewed unified offline package without publishing it
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: criminal-v2-unified-package
          path: campaign-unified-dist/
          retention-days: 14

      - name: Keep the isolated criminal-only preview package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: criminal-v3-standalone-preview
          path: criminal-preview-dist/
          retention-days: 14
